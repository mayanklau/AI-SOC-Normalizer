[project]
name = "ai-soc-normalizer"
version = "0.1.0"
description = "Security event normalizer using ECS or OSCF schemas."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ai-soc-normalizer = "normalizer.cli:main"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
